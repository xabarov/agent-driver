                  - paragraph [ref=f1e2343]:
                    - strong [ref=f1e2344]: "Выводы по каждому региону:"
                  - list [ref=f1e2345]:
                    - listitem [ref=f1e2346]:
                      - paragraph [ref=f1e2347]:
                        - strong [ref=f1e2348]: East (+4 000; +30,8%)
                        - text: "— абсолютный лидер по обоим критериям: и по приросту, и по темпу. Регион не только удерживает первое место по объёму, но и ускоряется быстрее остальных. Это указывает на сильную динамику спроса либо на успешные продажи/акции именно в этом регионе. Риск: дальнейшая концентрация выручки в East усиливает зависимость компании от одного рынка."
                    - listitem [ref=f1e2349]:
                      - paragraph [ref=f1e2350]:
                        - strong [ref=f1e2351]: North (+3 000; +25,0%)
                        - text: "— рост в точности равен среднему по компании (+25%). Регион движется «в ногу с рынком», сохраняя свою долю практически неизменной. Это стабильный, предсказуемый второй по значимости рынок: ни рывка, ни отставания."
                    - listitem [ref=f1e2352]:
                      - paragraph [ref=f1e2353]:
                        - strong [ref=f1e2354]: South (+2 000; +22,2%)
                        - text: — рост чуть ниже среднего. Регион немного теряет в доле, хотя абсолютно растёт. Причина может быть как в меньшей ёмкости рынка, так и в недостаточной активности продаж. Обращает на себя внимание, что у South абсолютный прирост равен приросту top-3 (+2 000), что говорит о сопоставимом абсолютном потенциале — вопрос к темпам.
                    - listitem [ref=f1e2355]:
                      - paragraph [ref=f1e2356]:
                        - strong [ref=f1e2357]: West (+1 500; +18,8%)
                        - text: "— самый медленный темп и минимальный абсолютный прирост. Регион дополнительно отстаёт: если в Q1 разрыв с South составлял 1 000, то в Q2 он вырос до 1 500. Динамика West — единственный тревожный сигнал в данных: регион стабильно растёт, но медленнее всех, и его доля в общей выручке сокращается."

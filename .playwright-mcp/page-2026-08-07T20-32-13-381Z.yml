                      - text: выручка по компании выросла на
                      - strong [ref=f1e2362]: 25%
                      - text: (с 42 000 до 52 500), все регионы в плюсе — это устойчивый рост, а не перераспределение между регионами.
                    - listitem [ref=f1e2363]:
                      - strong [ref=f1e2364]: "Структура концентрации:"
                      - text: East + North = 60,3% выручки; два региона обеспечивают почти две трети результата. Зависимость от топ-2 высокая, но не критичная.
                    - listitem [ref=f1e2365]:
                      - strong [ref=f1e2366]: "Ключевой драйвер роста — East:"
                      - text: регион дал 4 000 из 10 500 прироста по компании (38% всего прироста). Именно на него приходится основной вклад в общую динамику.
                    - listitem [ref=f1e2367]:
                      - strong [ref=f1e2368]: "Зона внимания — West:"
                      - text: минимальные темпы (+18,8%) и растущее отставание. Требуется разобрать причины (спрос, конкуренция, дистрибуция), иначе регион будет продолжать терять долю.
                    - listitem [ref=f1e2369]:
                      - strong [ref=f1e2370]: "Рекомендация по приоритетам:"
                      - text: удерживать и усиливать East как драйвер, догонять темпы в South (у него хороший абсолютный потенциал) и адресно работать с отставанием West.

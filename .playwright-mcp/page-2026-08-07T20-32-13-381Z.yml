                    - text: во всех четырёх регионах зафиксирован рост выручки в Q2, причём общий итог вырос с 42 000 до 52 500 (+25%). Ни один регион не показал падение — динамика однонаправленная и позитивная.
                  - separator [ref=f1e909]
                  - heading "Шаг 2. Доли каждого региона" [level=2] [ref=f1e2302]
                  - paragraph [ref=f1e2303]: "Расчёт: доля = итог региона / общий итог (94 500)."
                  - list [ref=f1e2304]:
                    - listitem [ref=f1e2305]:
                      - strong [ref=f1e2306]: East — 31,7%
                      - text: "(30 000 / 94 500). Лидер: почти треть всей выручки компании приходится на этот регион."
                    - listitem [ref=f1e2307]:
                      - strong [ref=f1e2308]: North — 28,6%
                      - text: (27 000 / 94 500). Уверенное второе место, отставание от лидера всего ~3 п.п.
                    - listitem [ref=f1e2309]:
                      - strong [ref=f1e2310]: South — 21,2%
                      - text: (20 000 / 94 500). Середина списка, заметно отстаёт от топ-2.
                    - listitem [ref=f1e2311]:
                      - strong [ref=f1e2312]: West — 18,5%
                      - text: (17 500 / 94 500). Минимальная доля — аутсайдер.
                  - paragraph [ref=f1e2313]:
                    - strong [ref=f1e2314]: "Вывод по структуре:"
                    - text: распределение выручки неравномерно, но не «перекошено в одного игрока». Два лидера — East и North — вместе дают
                    - strong [ref=f1e2315]: 60,3%
                    - text: "выручки (57 000 из 94 500), оставшиеся 39,7% делят South и West. Это типичная ситуация «ядро + периферия»: концентрация на топ-2 регионах высокая, но не критическая. У West и South есть существенный потенциал роста — каждая дополнительная тысяча в этих регионах сильнее изменит их долю, чем аналогичный прирост у лидеров."
                  - separator [ref=f1e924]
                  - heading "Шаг 3. Динамика Q1→Q2 по каждому региону" [level=2] [ref=f1e2316]
                  - paragraph [ref=f1e2317]: "Темп роста = (Q2 − Q1) / Q1 × 100:"

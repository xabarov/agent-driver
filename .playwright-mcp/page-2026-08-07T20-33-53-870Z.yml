                    - listitem [ref=f1e2767]:
                      - strong [ref=f1e2768]: East — 31,7%
                      - text: "(30 000 / 94 500). Лидер: почти треть всей выручки компании приходится на этот регион."
                    - listitem [ref=f1e2769]:
                      - strong [ref=f1e2770]: North — 28,6%
                      - text: (27 000 / 94 500). Уверенное второе место, отставание от лидера всего ~3 п.п.
                    - listitem [ref=f1e2771]:
                      - strong [ref=f1e2772]: South — 21,2%
                      - text: (20 000 / 94 500). Середина списка, заметно отстаёт от топ-2.
                    - listitem [ref=f1e2773]:
                      - strong [ref=f1e2774]: West — 18,5%
                      - text: (17 500 / 94 500). Минимальная доля — аутсайдер.
                  - paragraph [ref=f1e2775]:
                    - strong [ref=f1e2776]: "Вывод по структуре:"
                    - text: распределение выручки неравномерно, но не «перекошено в одного игрока». Два лидера — East и North — вместе дают
                    - strong [ref=f1e2777]: 60,3%
                    - text: "выручки (57 000 из 94 500), оставшиеся 39,7% делят South и West. Это типичная ситуация «ядро + периферия»: концентрация на топ-2 регионах высокая, но не критическая. У West и South есть существенный потенциал роста — каждая дополнительная тысяча в этих регионах сильнее изменит их долю, чем аналогичный прирост у лидеров."

name: tests

on:
  push:
    branches: [main, "remediation-*", "release-*"]
  pull_request:

jobs:
  # Fast default sweep across the supported Python matrix (>=3.11).
  # Excludes live/slow/postgres markers (see pyproject addopts).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,server,acp]"
      - name: Run default suite
        run: python -m pytest

  # Lint (isort/black/ruff/pylint) across the supported Python matrix.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make lint
        run: make lint BLACK="python -m black" ISORT="python -m isort" PYLINT="python -m pylint" RUFF="python -m ruff"

  # Type-check the supported embedding surface + durable control plane
  # (scope pinned in pyrightconfig.json; analysed against pythonVersion 3.11).
  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make type
        run: make type PYRIGHT="python -m pyright"

  # Docs-consistency gate (facade __all__ <-> docs/embedding.md, version/docs agree).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make docs-check
        run: make docs-check VENV_PYTEST="python -m pytest"

  # Mandatory real-Postgres control-plane matrix (R2 / epic 058). This job must
  # FAIL — never skip green — if the DSN, the psycopg dependency, or the tests
  # themselves are missing.
  postgres-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ad
          POSTGRES_PASSWORD: ad
          POSTGRES_DB: ad_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ad -d ad_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AD_REQUIRE_POSTGRES: "1"
      AD_POSTGRES_TEST_DSN: "postgresql://ad:ad@localhost:5432/ad_control"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with postgres + collection extras)
        run: python -m pip install -e ".[dev,server,acp,postgres]"
      - name: Guard — real postgres tests must exist (fail, not skip)
        run: |
          # pytest exits 5 when the marker selects zero tests, 0 when >=1 is
          # collected, other non-zero on a collection error — all of which must
          # fail this mandatory job rather than skip green. The `if` avoids the
          # step's errexit aborting before we can report.
          if python -m pytest -m postgres --collect-only -q; then
            echo "postgres tests collected"
          else
            echo "::error::AD_REQUIRE_POSTGRES=1 but 'postgres' collection returned exit $? (5=no tests)"
            exit 1
          fi
      - name: Run real-Postgres control-plane matrix
        run: python -m pytest -m postgres -v

  # The release artifact is built only after every behavioral gate is green.
  # Two caller umasks must still produce byte-identical wheels because the
  # repository-owned builder normalizes the exported Git tree itself.
  release-wheel:
    needs: [test, lint, type, docs, postgres-suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build requirements
        run: python -m pip install "setuptools>=68" wheel
      - name: Build twice and prove byte identity
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/release-wheel-first"
          second="$RUNNER_TEMP/release-wheel-second"
          mkdir -p "$first" "$second"
          (umask 077; make release-wheel RELEASE_PYTHON=python RELEASE_WHEEL_DIR="$first")
          (umask 002; make release-wheel RELEASE_PYTHON=python RELEASE_WHEEL_DIR="$second")
          first_wheel=$(find "$first" -maxdepth 1 -name 'agent_driver-*.whl' -print)
          second_wheel=$(find "$second" -maxdepth 1 -name 'agent_driver-*.whl' -print)
          cmp "$first_wheel" "$second_wheel"
          sha256sum "$first_wheel" "$second_wheel"
          python -m zipfile -t "$first_wheel"
          python -m pip install --no-deps "$first_wheel"
          python - <<'PY'
          from importlib.metadata import metadata, version
          import agent_driver
          import agent_driver.embedding
          import agent_driver.runtime

          package = metadata("agent-driver")
          assert version("agent-driver") == agent_driver.__version__
          assert package["Requires-Python"] == ">=3.11"
          print(f"verified agent-driver {agent_driver.__version__}")
          PY
          cp "$first_wheel" "$GITHUB_WORKSPACE/"
      - name: Upload exact release wheel
        uses: actions/upload-artifact@v4
        with:
          name: agent-driver-wheel-${{ github.sha }}
          path: agent_driver-*.whl
          if-no-files-found: error
          retention-days: 30

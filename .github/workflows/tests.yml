name: tests

on:
  push:
    branches: [main, "remediation-*", "release-*"]
  pull_request:

jobs:
  # Fast default sweep across the supported Python matrix (>=3.11).
  # Excludes live/slow/postgres markers (see pyproject addopts).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,server,acp]"
      - name: Run default suite
        run: python -m pytest

  # Lint (isort/black/ruff/pylint) across the supported Python matrix.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make lint
        run: make lint BLACK="python -m black" ISORT="python -m isort" PYLINT="python -m pylint" RUFF="python -m ruff"

  # Type-check the supported embedding surface + durable control plane
  # (scope pinned in pyrightconfig.json; analysed against pythonVersion 3.11).
  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make type
        run: make type PYRIGHT="python -m pyright"

  # Docs-consistency gate (facade __all__ <-> docs/embedding.md, version/docs agree).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: make docs-check
        run: make docs-check VENV_PYTEST="python -m pytest"

  # Mandatory real-Postgres control-plane matrix (R2 / epic 058). This job must
  # FAIL — never skip green — if the DSN, the psycopg dependency, or the tests
  # themselves are missing.
  postgres-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ad
          POSTGRES_PASSWORD: ad
          POSTGRES_DB: ad_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ad -d ad_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AD_REQUIRE_POSTGRES: "1"
      AD_POSTGRES_TEST_DSN: "postgresql://ad:ad@localhost:5432/ad_control"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with postgres + collection extras)
        run: python -m pip install -e ".[dev,server,acp,postgres]"
      - name: Guard — real postgres tests must exist (fail, not skip)
        run: |
          count=$(python -m pytest -m postgres --collect-only -q 2>/dev/null | grep -c '::' || true)
          echo "collected postgres tests: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::AD_REQUIRE_POSTGRES=1 but no 'postgres'-marked tests collected"
            exit 1
          fi
      - name: Run real-Postgres control-plane matrix
        run: python -m pytest -m postgres -v

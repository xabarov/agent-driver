[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-driver"
version = "0.9.0"
description = "Domain-neutral runtime contracts for agentic applications."
readme = "docs/README.md"
license = "LicenseRef-NOASSERTION"
requires-python = ">=3.11"
dependencies = [
  "arize-phoenix-otel>=0.16.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "pydantic>=2.7.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
  "black>=26.0.0",
  "isort>=8.0.0",
  "pylint>=4.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.400",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-xdist>=3.6.0",
  "playwright>=1.48.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
cli = [
  "prompt_toolkit>=3.0.43",
  "rich>=13.0.0",
]
instructor = [
  "instructor>=1.7.0",
]
acp = [
  "agent-client-protocol>=0.10.0",
]
server = [
  "starlette>=0.40.0",
  "uvicorn[standard]>=0.30.0",
]
pdf = [
  "pypdf>=4.0.0",
]

[project.scripts]
agent-driver = "agent_driver.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_driver*"]

[tool.setuptools.package-data]
"agent_driver" = ["py.typed"]
"agent_driver.prompts.templates" = ["*.txt"]
"agent_driver.skills.curated" = ["*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default sweep excludes live (network-bound) and slow (subprocess /
# scientific stack import) tests. Override with `-m slow` or
# `-m "slow or not slow"` to include them. Opt-in parallel: `-n auto`
# (requires pytest-xdist from the dev extra).
# ``--import-mode=importlib`` is the default: two test files share a basename
# (tests/harness/test_lifecycle_hooks.py and tests/runtime/test_lifecycle_hooks.py)
# with no __init__.py, so the legacy "prepend" mode aborts collection with an
# "import file mismatch". importlib mode collects them cleanly — no per-invocation flag.
addopts = "-q -m 'not live and not slow and not postgres' --import-mode=importlib"
markers = [
  "live: optional network/provider checks disabled by default",
  "slow: subprocess- or scientific-stack-bound tests; excluded from default sweep",
  "postgres: real-Postgres control-plane tests; run only in the mandatory postgres CI job (marker excluded from the default sweep). Fails (not skips) without a DSN when AD_REQUIRE_POSTGRES=1.",
]

[tool.setuptools]
script-files = ["scripts/check_package_layout.py"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

# Pin the rule set explicitly so `make lint` is deterministic across ruff
# versions: newer ruff releases enable additional lint families (e.g. BLE, EXE)
# by default, which would fail CI on pre-existing code the project never chose to
# enforce. This is ruff's documented default select (pyflakes + a curated pycodestyle
# subset) — matching what the project has always linted against.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
recursive = true

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "fixme",
  "missing-module-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
]
